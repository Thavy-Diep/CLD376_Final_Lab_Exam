# Public entry point: only the API gateway is exposed
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: pod1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
---
# Internal: gateway (pod 1) -> delete-service (pod 2)
apiVersion: v1
kind: Service
metadata:
  name: delete-service
spec:
  type: ClusterIP
  selector:
    app: pod2
  ports:
    - port: 3002
      targetPort: 3002
