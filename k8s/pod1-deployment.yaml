# POD 1: api-gateway + registration-service (2 containers in ONE pod)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod1-gateway-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod1
  template:
    metadata:
      labels:
        app: pod1
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: REGISTRATION_URL
              value: "http://localhost:3001"
            - name: DELETE_URL
              value: "http://delete-service:3002"
        - name: registration-service
          image: registration-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-atlas
                  key: connection-string
            - name: MONGODB_DB_NAME
              value: "college"
